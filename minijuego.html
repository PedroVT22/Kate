<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Me amas? 💜</title>
<style>
  :root{
    --bg-deep:#0d0518;
    --bg-mid:#1a0b2e;
    --purple-1:#7b2ff7;
    --purple-2:#a855f7;
    --lilac:#c9a8ff;
    --neon:#e879f9;
    --neon-glow:#d946ef;
    --text-soft:#f3e8ff;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    width:100%;
    font-family:'Segoe UI', Arial, sans-serif;
    overflow:hidden;
  }

  body{
    background:
      radial-gradient(circle at 20% 20%, rgba(168,85,247,0.25), transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(217,70,239,0.2), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(123,47,247,0.25), transparent 50%),
      linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 60%, #14061f);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:opacity 1.1s ease;
  }

  .particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .particle{
    position:absolute;
    bottom:-40px;
    color:var(--neon);
    opacity:.55;
    font-size:14px;
    filter:drop-shadow(0 0 6px var(--neon-glow));
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:.6;}
    90%{opacity:.5;}
    100%{ transform:translateY(-110vh) translateX(20px) rotate(180deg); opacity:0;}
  }

  .stage{
    position:relative;
    z-index:2;
    width:min(520px, 92vw);
    text-align:center;
    padding:20px;
  }

  .heart-icon{
    width:56px;
    height:56px;
    margin:0 auto 18px;
    filter:drop-shadow(0 0 12px var(--neon-glow));
    animation:beat 1.4s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    25%{ transform:scale(1.12); }
    40%{ transform:scale(0.96); }
    60%{ transform:scale(1.08); }
  }

  h1{
    font-size:clamp(1.6rem, 5vw, 2.3rem);
    font-weight:700;
    letter-spacing:.4px;
    background:linear-gradient(90deg, var(--lilac), var(--neon));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:44px;
    animation:cardIn 1s ease;
  }

  @keyframes cardIn{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }

  .buttons-row{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:26px;
    min-height:120px;
  }

  .btn{
    padding:15px 34px;
    border:none;
    border-radius:16px;
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:.4px;
    cursor:pointer;
    color:#fff;
    transition:transform .18s ease, box-shadow .18s ease;
  }

  #btnYes{
    background:linear-gradient(90deg, var(--purple-1), var(--neon-glow));
    box-shadow:0 0 22px rgba(217,70,239,0.45);
  }
  #btnYes:hover{
    transform:translateY(-3px) scale(1.04);
    box-shadow:0 6px 30px rgba(217,70,239,0.65);
  }
  #btnYes:active{
    transform:translateY(0) scale(.97);
  }

  #btnNo{
    background:linear-gradient(90deg, #3a1f5c, #522a7a);
    box-shadow:0 0 14px rgba(123,47,247,0.3);
    position:fixed;
    z-index:5;
    transition: transform .18s ease, left .28s cubic-bezier(.34,1.56,.64,1), top .28s cubic-bezier(.34,1.56,.64,1);
  }
  #btnNo:hover{
    box-shadow:0 0 20px rgba(123,47,247,0.5);
  }

  .no-placeholder{
    width:130px;
    height:52px;
    visibility:hidden;
  }

  .hint-msg{
    margin-top:34px;
    font-size:.82rem;
    color:#9c7fc4;
    font-style:italic;
    min-height:18px;
    opacity:.85;
  }

  /* Animación tierna al aceptar */
  .love-burst{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:10;
    opacity:0;
    transition:opacity .4s ease;
  }
  .love-burst.show{
    opacity:1;
  }
  .big-heart{
    font-size:5rem;
    color:var(--neon);
    filter:drop-shadow(0 0 24px var(--neon-glow));
    animation:popHeart .9s ease forwards;
  }
  @keyframes popHeart{
    0%{ transform:scale(0) rotate(-15deg); opacity:0; }
    50%{ transform:scale(1.3) rotate(6deg); opacity:1; }
    75%{ transform:scale(0.95) rotate(-3deg); }
    100%{ transform:scale(1.1) rotate(0deg); opacity:1; }
  }

  .mini-heart{
    position:fixed;
    bottom:-30px;
    font-size:1.4rem;
    color:var(--neon);
    filter:drop-shadow(0 0 8px var(--neon-glow));
    animation:riseHeart 1.8s ease-in forwards;
    pointer-events:none;
    z-index:9;
  }
  @keyframes riseHeart{
    0%{ transform:translateY(0) scale(.6); opacity:0;}
    15%{opacity:1;}
    100%{ transform:translateY(-100vh) scale(1.1); opacity:0;}
  }

  body.fade-out{
    opacity:0;
  }

  @media (max-width:480px){
    .buttons-row{ flex-direction:column; gap:40px; }
  }
</style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="stage">
    <div class="heart-icon">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 56S8 40 8 22a13 13 0 0124-8 13 13 0 0124 8c0 18-24 34-24 34z" fill="url(#gradHeart)"/>
        <defs>
          <linearGradient id="gradHeart" x1="8" y1="14" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7b2ff7"/>
            <stop offset="1" stop-color="#e879f9"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1>¿Me amas, Katerin?</h1>

    <div class="buttons-row" id="buttonsRow">
      <button class="btn" id="btnYes">Sí 💜</button>
      <div class="no-placeholder"></div>
      <button class="btn" id="btnNo">No</button>
    </div>

    <p class="hint-msg" id="hintMsg">Inténtalo... si puedes 😏</p>
  </div>

  <div class="love-burst" id="loveBurst">
    <div class="big-heart">💜</div>
  </div>

<script>
  // ---------- Partículas flotantes ----------
  const particlesContainer = document.getElementById('particles');
  const symbols = ['♥','✦','✧','♡','✷'];
  for(let i=0;i<20;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left = Math.random()*100 + 'vw';
    p.style.fontSize = (10 + Math.random()*14) + 'px';
    const duration = 8 + Math.random()*10;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = (Math.random()*duration) + 's';
    particlesContainer.appendChild(p);
  }

  // ---------- Lógica del botón "No" evasivo ----------
  const btnNo = document.getElementById('btnNo');
  const hintMsg = document.getElementById('hintMsg');
  const messages = [
    "Inténtalo... si puedes 😏",
    "¡No tan rápido! 💨",
    "Casi... pero no 😜",
    "Ese botón no quiere que lo toques 💜",
    "¡Sigue intentando! 🥰",
    "Ey ey como que no",
    "Paraaaaaaaaaa",
    "kateeeeeeeeee",
    "Ya di que siiiiii"
  ];
  let attempts = 0;

  function placeButtonInitial(){
    const rect = btnNo.getBoundingClientRect();
    btnNo.style.left = rect.left + 'px';
    btnNo.style.top = rect.top + 'px';
  }
  window.addEventListener('load', placeButtonInitial);

  function escapeButton(){
    const btnRect = btnNo.getBoundingClientRect();
    const margin = 20;
    const maxX = window.innerWidth - btnRect.width - margin;
    const maxY = window.innerHeight - btnRect.height - margin;

    const newX = Math.max(margin, Math.random() * maxX);
    const newY = Math.max(margin, Math.random() * maxY);

    btnNo.style.left = newX + 'px';
    btnNo.style.top = newY + 'px';

    attempts++;
    hintMsg.textContent = messages[Math.min(attempts, messages.length - 1)];
  }

  // Escapa al acercar el cursor (evita incluso el clic)
  btnNo.addEventListener('mouseenter', escapeButton);
  btnNo.addEventListener('mousedown', (e) => { e.preventDefault(); escapeButton(); });

  // Soporte táctil: escapa apenas se toca
  btnNo.addEventListener('touchstart', (e) => {
    e.preventDefault();
    escapeButton();
  }, {passive:false});

  // También escapa si el foco llega por teclado (Tab)
  btnNo.addEventListener('focus', escapeButton);

  // Reposiciona si la ventana cambia de tamaño
  window.addEventListener('resize', () => {
    const btnRect = btnNo.getBoundingClientRect();
    const maxX = window.innerWidth - btnRect.width - 20;
    const maxY = window.innerHeight - btnRect.height - 20;
    const currentX = Math.min(parseFloat(btnNo.style.left || 0), maxX);
    const currentY = Math.min(parseFloat(btnNo.style.top || 0), maxY);
    btnNo.style.left = Math.max(20, currentX) + 'px';
    btnNo.style.top = Math.max(20, currentY) + 'px';
  });

  // ---------- Lógica del botón "Sí" ----------
  const btnYes = document.getElementById('btnYes');
  const loveBurst = document.getElementById('loveBurst');

  function spawnMiniHearts(){
    const heartsSymbols = ['💜','✨','💗','♥'];
    for(let i=0;i<18;i++){
      const h = document.createElement('div');
      h.className = 'mini-heart';
      h.textContent = heartsSymbols[Math.floor(Math.random()*heartsSymbols.length)];
      h.style.left = Math.random()*100 + 'vw';
      h.style.animationDelay = (Math.random()*0.6) + 's';
      h.style.fontSize = (16 + Math.random()*18) + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 2200);
    }
  }

  btnYes.addEventListener('click', () => {
    btnYes.disabled = true;
    btnNo.style.pointerEvents = 'none';

    loveBurst.classList.add('show');
    spawnMiniHearts();

    setTimeout(() => {
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'galaxia.html';
      }, 1000);
    }, 1600);
  });
</script>

</body>
</html>
