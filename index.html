<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Privado 💜</title>
<style>
  :root{
    --bg-deep:#0d0518;
    --bg-mid:#1a0b2e;
    --purple-1:#7b2ff7;
    --purple-2:#a855f7;
    --lilac:#c9a8ff;
    --neon:#e879f9;
    --neon-glow:#d946ef;
    --text-soft:#f3e8ff;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    font-family:'Segoe UI', Arial, sans-serif;
    overflow:hidden;
  }

  body{
    background:
      radial-gradient(circle at 20% 20%, rgba(168,85,247,0.25), transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(217,70,239,0.2), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(123,47,247,0.25), transparent 50%),
      linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 60%, #14061f);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:opacity 1.1s ease;
  }

  /* Partículas flotantes tipo corazones/estrellas */
  .particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .particle{
    position:absolute;
    bottom:-40px;
    color:var(--neon);
    opacity:.55;
    font-size:14px;
    filter:drop-shadow(0 0 6px var(--neon-glow));
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:.6;}
    90%{opacity:.5;}
    100%{ transform:translateY(-110vh) translateX(20px) rotate(180deg); opacity:0;}
  }

  .card{
    position:relative;
    z-index:2;
    width:min(420px, 90vw);
    padding:42px 32px 34px;
    border-radius:26px;
    background:rgba(24,10,41,0.65);
    backdrop-filter:blur(14px);
    border:1px solid rgba(216,170,255,0.25);
    box-shadow:
      0 0 40px rgba(168,85,247,0.25),
      0 0 90px rgba(217,70,239,0.12),
      inset 0 0 60px rgba(123,47,247,0.06);
    text-align:center;
    animation:cardIn 1s ease;
  }

  @keyframes cardIn{
    from{opacity:0; transform:translateY(24px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .lock-icon{
    width:62px;
    height:62px;
    margin:0 auto 14px;
    position:relative;
  }
  .lock-icon svg{
    width:100%;
    height:100%;
    filter:drop-shadow(0 0 10px var(--neon-glow));
    animation:pulseLock 2.6s ease-in-out infinite;
  }
  @keyframes pulseLock{
    0%,100%{filter:drop-shadow(0 0 8px var(--neon-glow));}
    50%{filter:drop-shadow(0 0 18px var(--purple-2));}
  }

  h1{
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:.5px;
    background:linear-gradient(90deg, var(--lilac), var(--neon));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:6px;
  }

  .subtitle{
    color:#c8b6e6;
    font-size:.85rem;
    margin-bottom:30px;
    letter-spacing:.3px;
  }

  /* --- Candado con ruedas --- */
  .wheels-wrapper{
    display:flex;
    justify-content:center;
    gap:14px;
    padding:20px 14px;
    border-radius:18px;
    background:linear-gradient(180deg, rgba(123,47,247,0.14), rgba(217,70,239,0.06));
    border:1px solid rgba(216,170,255,0.2);
    box-shadow:inset 0 2px 10px rgba(0,0,0,0.4);
    margin-bottom:22px;
  }

  .wheel{
    position:relative;
    width:64px;
    height:130px;
    border-radius:12px;
    background:linear-gradient(180deg, #1c0d33, #12071f);
    border:1px solid rgba(216,170,255,0.3);
    overflow:hidden;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
  }

  .wheel-track{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:grab;
    user-select:none;
    touch-action:none;
    transition: transform .28s cubic-bezier(.22,.9,.32,1.28);
  }
  .wheel-track:active{cursor:grabbing;}

  .digit{
    height:43.33px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    font-weight:700;
    color:#6b4b95;
    transition:color .25s, text-shadow .25s;
  }
  .digit.center{
    color:var(--text-soft);
    text-shadow:0 0 12px var(--neon-glow), 0 0 4px var(--purple-2);
    font-size:1.8rem;
  }

  /* marco de selección central */
  .wheel::before, .wheel::after{
    content:'';
    position:absolute;
    left:0;
    right:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--neon), transparent);
    z-index:3;
    opacity:.7;
  }
  .wheel::before{ top:43.33px; }
  .wheel::after{ top:86.66px; }

  .arrow-up, .arrow-down{
    display:block;
    width:100%;
    text-align:center;
    color:var(--lilac);
    font-size:1rem;
    cursor:pointer;
    padding:4px 0;
    transition:color .2s, transform .2s;
    user-select:none;
  }
  .arrow-up:hover, .arrow-down:hover{
    color:var(--neon);
    transform:scale(1.15);
  }

  .wheels-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .separator{
    display:flex;
    align-items:center;
    color:var(--purple-2);
    font-size:1.6rem;
    font-weight:700;
    padding-bottom:0;
  }

  .btn-unlock{
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg, var(--purple-1), var(--neon-glow));
    color:#fff;
    font-size:1rem;
    font-weight:600;
    letter-spacing:.4px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(217,70,239,0.4);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn-unlock:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 28px rgba(217,70,239,0.6);
  }
  .btn-unlock:active{
    transform:translateY(0px) scale(.98);
  }

  .error-msg{
    margin-top:14px;
    color:#ff8fd4;
    font-size:.85rem;
    min-height:18px;
    opacity:0;
    transition:opacity .3s;
  }
  .error-msg.show{
    opacity:1;
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .hint{
    margin-top:22px;
    font-size:.78rem;
    color:#9c7fc4;
    letter-spacing:.3px;
    font-style:italic;
  }

  .success-msg{
    margin-top:14px;
    color:#e9d5ff;
    font-size:.9rem;
    min-height:18px;
    opacity:0;
    transition:opacity .4s;
  }
  .success-msg.show{
    opacity:1;
  }

  body.fade-out{
    opacity:0;
  }

  @media (max-width:400px){
    .wheel{width:52px;}
    .digit{font-size:1.25rem;}
    .digit.center{font-size:1.5rem;}
  }
</style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="lock-icon">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="28" width="36" height="28" rx="6" fill="url(#gradLock)" stroke="#e879f9" stroke-width="1.5"/>
        <path d="M20 28V20a12 12 0 0124 0v8" stroke="#c9a8ff" stroke-width="4" stroke-linecap="round" fill="none"/>
        <circle cx="32" cy="42" r="4" fill="#f3e8ff"/>
        <rect x="30" y="44" width="4" height="8" rx="2" fill="#f3e8ff"/>
        <defs>
          <linearGradient id="gradLock" x1="14" y1="28" x2="50" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7b2ff7"/>
            <stop offset="1" stop-color="#d946ef"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1>Acceso Privado</h1>
    <p class="subtitle">Desliza los números para desbloquear nuestro secreto</p>

    <div class="wheels-wrapper">
      <div class="wheels-col">
        <span class="arrow-up" data-wheel="0" data-dir="up">▲</span>
        <div class="wheel">
          <div class="wheel-track" id="wheel-0" data-index="0"></div>
        </div>
        <span class="arrow-down" data-wheel="0" data-dir="down">▼</span>
      </div>

      <div class="separator">/</div>

      <div class="wheels-col">
        <span class="arrow-up" data-wheel="1" data-dir="up">▲</span>
        <div class="wheel">
          <div class="wheel-track" id="wheel-1" data-index="1"></div>
        </div>
        <span class="arrow-down" data-wheel="1" data-dir="down">▼</span>
      </div>

      <div class="separator">/</div>

      <div class="wheels-col">
        <span class="arrow-up" data-wheel="2" data-dir="up">▲</span>
        <div class="wheel">
          <div class="wheel-track" id="wheel-2" data-index="2"></div>
        </div>
        <span class="arrow-down" data-wheel="2" data-dir="down">▼</span>
      </div>
    </div>

    <button class="btn-unlock" id="unlockBtn">Desbloquear 💜</button>

    <div class="error-msg" id="errorMsg">La combinación no es correcta, inténtalo de nuevo</div>
    <div class="success-msg" id="successMsg">Combinación correcta... abriendo puerta ✨</div>

    <p class="hint">Pista: Nuestra fecha especial (DD/MM/AA)</p>
  </div>

<script>
  // ---------- Configuración ----------
  const SECRET = ["18", "11", "25"];
  const DIGIT_HEIGHT = 43.33;
  const VALUES = Array.from({length:100}, (_, i) => i.toString().padStart(2,'0')); // "00" a "99"

  const wheelsState = [0, 0, 0]; // índice actual en VALUES para cada rueda

  // ---------- Construcción de partículas flotantes ----------
  const particlesContainer = document.getElementById('particles');
  const symbols = ['♥','✦','✧','♡','✷'];
  for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left = Math.random()*100 + 'vw';
    p.style.fontSize = (10 + Math.random()*14) + 'px';
    const duration = 8 + Math.random()*10;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = (Math.random()*duration) + 's';
    particlesContainer.appendChild(p);
  }

  // ---------- Construcción de ruedas ----------
  function buildWheel(wheelIndex){
    const track = document.getElementById('wheel-' + wheelIndex);
    track.innerHTML = '';
    VALUES.forEach((val) => {
      const d = document.createElement('div');
      d.className = 'digit';
      d.textContent = val;
      track.appendChild(d);
    });
    updateWheelPosition(wheelIndex, false);
  }

  function updateWheelPosition(wheelIndex, animate = true){
    const track = document.getElementById('wheel-' + wheelIndex);
    const idx = wheelsState[wheelIndex];
    track.style.transition = animate ? 'transform .28s cubic-bezier(.22,.9,.32,1.28)' : 'none';
    // Centramos: desplazamos para que el valor actual quede en la fila central (segunda fila visible)
    const offset = -(idx * DIGIT_HEIGHT) + DIGIT_HEIGHT; // +1 fila de margen arriba
    track.style.transform = `translateY(${offset}px)`;
    highlightCenter(wheelIndex);
  }

  function highlightCenter(wheelIndex){
    const track = document.getElementById('wheel-' + wheelIndex);
    const digits = track.querySelectorAll('.digit');
    digits.forEach(d => d.classList.remove('center'));
    const idx = wheelsState[wheelIndex];
    if(digits[idx]) digits[idx].classList.add('center');
  }

  function changeWheel(wheelIndex, dir){
    let idx = wheelsState[wheelIndex];
    idx += dir;
    if(idx < 0) idx = VALUES.length - 1;
    if(idx >= VALUES.length) idx = 0;
    wheelsState[wheelIndex] = idx;
    updateWheelPosition(wheelIndex, true);
    clearError();
  }

  // Inicializar las 3 ruedas
  for(let i=0;i<3;i++){ buildWheel(i); }

  // Ajustar altura del wrapper para mostrar 3 filas (arriba/centro/abajo)
  document.querySelectorAll('.wheel').forEach(w => {
    w.style.height = (DIGIT_HEIGHT * 3) + 'px';
  });
  document.querySelectorAll('.wheel-track').forEach(t => {
    // padding fantasma con un div extra arriba y abajo para efecto de scroll infinito visual
  });

  // ---------- Botones flecha ----------
  document.querySelectorAll('.arrow-up, .arrow-down').forEach(btn => {
    btn.addEventListener('click', () => {
      const wIndex = parseInt(btn.dataset.wheel, 10);
      const dir = btn.dataset.dir === 'up' ? -1 : 1;
      changeWheel(wIndex, dir);
    });
  });

  // ---------- Deslizar (drag / touch) sobre la rueda ----------
  function enableDrag(wheelIndex){
    const track = document.getElementById('wheel-' + wheelIndex);
    let startY = 0;
    let dragging = false;
    let accumulated = 0;

    function onStart(y){
      dragging = true;
      startY = y;
      accumulated = 0;
      track.style.transition = 'none';
    }
    function onMove(y){
      if(!dragging) return;
      const delta = y - startY;
      accumulated = delta;
      const idx = wheelsState[wheelIndex];
      const baseOffset = -(idx * DIGIT_HEIGHT) + DIGIT_HEIGHT;
      track.style.transform = `translateY(${baseOffset + delta}px)`;
    }
    function onEnd(){
      if(!dragging) return;
      dragging = false;
      const steps = Math.round(-accumulated / DIGIT_HEIGHT);
      if(steps !== 0){
        changeWheel(wheelIndex, steps);
      } else {
        updateWheelPosition(wheelIndex, true);
      }
    }

    track.addEventListener('mousedown', e => onStart(e.clientY));
    window.addEventListener('mousemove', e => onMove(e.clientY));
    window.addEventListener('mouseup', onEnd);

    track.addEventListener('touchstart', e => onStart(e.touches[0].clientY), {passive:true});
    track.addEventListener('touchmove', e => onMove(e.touches[0].clientY), {passive:true});
    track.addEventListener('touchend', onEnd);

    // Scroll con rueda del mouse
    track.parentElement.addEventListener('wheel', e => {
      e.preventDefault();
      changeWheel(wheelIndex, e.deltaY > 0 ? 1 : -1);
    }, {passive:false});
  }
  for(let i=0;i<3;i++){ enableDrag(i); }

  // ---------- Validación ----------
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  function clearError(){
    errorMsg.classList.remove('show');
  }

  document.getElementById('unlockBtn').addEventListener('click', () => {
    const currentCombo = wheelsState.map(idx => VALUES[idx]);
    const isCorrect = currentCombo.every((val, i) => val === SECRET[i]);

    if(isCorrect){
      clearError();
      successMsg.classList.add('show');
      document.getElementById('unlockBtn').disabled = true;
      setTimeout(() => {
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = 'minijuego.html';
        }, 1000);
      }, 700);
    } else {
      successMsg.classList.remove('show');
      errorMsg.classList.remove('show');
      // reflow para reiniciar animación shake
      void errorMsg.offsetWidth;
      errorMsg.classList.add('show');
    }
  });
</script>

</body>
</html>
